name: Frontend CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: faizansaiyed123/ledgerpulse_backend
          path: backend-e2e

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Install backend dependencies
        working-directory: backend-e2e
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Prepare SQLite E2E backend
        working-directory: backend-e2e
        run: |
          cat > e2e_server.py <<'PY'
          from backend.app import create_app
          from backend.database import db

          class E2EConfig:
              TESTING = True
              SECRET_KEY = "ledgerpulse-e2e-secret"
              SQLALCHEMY_DATABASE_URI = "sqlite:////tmp/ledgerpulse-e2e.db"
              SQLALCHEMY_TRACK_MODIFICATIONS = False
              SQLALCHEMY_ENGINE_OPTIONS = {}
              CORS_ORIGINS = "http://127.0.0.1:5173"
              FRONTEND_URL = "http://127.0.0.1:5173"
              PLATFORM_ADMIN_UIDS = {"test-user"}
              FIREBASE_PROJECT_ID = ""
              FIREBASE_CLIENT_EMAIL = ""
              FIREBASE_PRIVATE_KEY = ""
              SMTP_HOST = ""
              SMTP_PORT = 587
              SMTP_USERNAME = ""
              SMTP_PASSWORD = ""
              SMTP_FROM_EMAIL = ""
              SMTP_FROM_NAME = "LedgerPulse"
              SMTP_USE_TLS = True
              SMTP_USE_SSL = False
              CONTACT_INBOX_EMAIL = ""
              ENV = "test"

              @classmethod
              def validate(cls):
                  return None

          app = create_app(E2EConfig)
          with app.app_context():
              db.drop_all()
              db.create_all()

          app.run(host="127.0.0.1", port=5000, debug=False)
          PY
          PYTHONPATH=. python e2e_server.py > /tmp/ledgerpulse-backend.log 2>&1 &
          echo $! > /tmp/ledgerpulse-backend.pid

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end browser suite
        run: npm run test:e2e

      - name: Capture backend log on failure
        if: failure()
        run: cat /tmp/ledgerpulse-backend.log || true

      - name: Generate curated visual walkthrough metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          visuals = sorted(Path("test-results/visuals").glob("*.png"))
          Path("test-results/visuals/manifest.json").write_text(json.dumps([
              {"section":"LedgerPulse E2E","step":i+1,"title":p.stem.replace("-", " ").title(),"filename":str(p.relative_to("test-results")).replace("\\","/"),"viewport":"1280 × 720"}
              for i,p in enumerate(visuals)
          ], indent=2))
          lines = [
              "# LedgerPulse — End-to-End Visual Walkthrough",
              "",
              "> Curated screenshots are captured only after their corresponding browser assertions pass. Failure screenshots and traces remain in CI artifacts.",
              "",
              "**Browser:** Chromium controlled by Playwright  ",
              "**Viewport:** 1280 × 720  ",
              "**Backend:** Flask API using disposable SQLite in CI  ",
              "**Authentication:** isolated CI test identity; no production Firebase credentials are used",
              "",
              "## Coverage",
              "",
              "Public website, pricing/FAQ/legal, contact failure handling, interactive demo and role switching, authenticated dashboard bootstrap, sample-data loading, invoices, payments, expenses, customers, vendors, recurring billing, reports, team management, organization settings, notifications, platform administration, tenant isolation, authorization failures, financial validation and API error handling.",
              "",
              "## Evidence",
              ""
          ]
          for p in visuals:
              rel = str(p.relative_to("test-results")).replace("\\","/")
              lines.extend([f"![{p.stem}]({rel})",""])
          lines.extend([
              "## Verification note",
              "",
              "Each published image is emitted only after its workflow checkpoint passes. API assertions independently verify persistence, authorization, tenant ownership and validation behavior."
          ])
          Path("test-results/VISUAL-TEST-WALKTHROUGH.md").write_text("\n".join(lines)+"\n")
          PY

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledgerpulse-e2e-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish curated walkthrough on success
        if: success()
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p docs/testing/visuals
          rm -f docs/testing/visuals/*.png
          cp test-results/visuals/*.png docs/testing/visuals/
          cp test-results/VISUAL-TEST-WALKTHROUGH.md docs/testing/VISUAL-TEST-WALKTHROUGH.md
          cp test-results/visuals/manifest.json docs/testing/visuals/manifest.json
          cat > docs/testing/README.md <<EOF
          # LedgerPulse E2E Test Evidence

          This folder contains CI-generated browser evidence from the full LedgerPulse frontend/backend end-to-end suite.

          - [Visual walkthrough](VISUAL-TEST-WALKTHROUGH.md)
          - [Screenshot manifest](visuals/manifest.json)
          - [Full-resolution screenshots](visuals/)
          - [CI run](https://github.com/${SOURCE_REPOSITORY}/actions/runs/${SOURCE_RUN_ID})

          Screenshots are captured only after their corresponding UI assertions pass. Failure screenshots remain in CI artifacts and are not published as successful evidence.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/testing
          if git diff --cached --quiet; then
            echo "No visual evidence changes."
          else
            git commit -m "Publish LedgerPulse E2E visual evidence [skip ci]"
            git push origin HEAD:main
          fi
