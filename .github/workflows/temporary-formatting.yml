name: Temporary Formatting Pass
on:
  push:
    branches:
      - chore/formatting-only-ledgerpulse
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run pinned Prettier
        run: |
          npx --yes prettier@3.6.2 --write "src/**/*.{ts,tsx,js,jsx,json,css,scss,html}" "e2e/**/*.{ts,tsx,js,jsx,json,css,scss,html}" "*.{ts,tsx,js,jsx,json,css,scss,html}" "docs/testing/visuals/manifest.json"
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src e2e package.json tsconfig.json vite.config.ts playwright.config.ts index.html docs/testing/visuals/manifest.json
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "style: format frontend source and config files"
            git push origin HEAD
          fi
